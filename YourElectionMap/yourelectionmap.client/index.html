<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#FAF5EB"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191410"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="See the district maps you vote in — plus the candidates and dates that come with them."
    />
    <title>YourElectionMap — see the district maps you vote in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Apply a saved theme choice before first paint so an explicit light or
      // dark preference never flashes the other scheme. ThemeToggle owns the value.
      try {
        var saved = localStorage.getItem('yem.theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (error) {
        // Storage blocked or unavailable: fall back to the OS preference.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
