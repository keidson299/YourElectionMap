<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root {
      --bg: #F7F4EE; --card: #FFFFFF; --field: #FCFBF8;
      --ink: #191E23; --ink-soft: #5C646C;
      --rule: #E4DED2; --rule-strong: #CFC7B7;
      --map-a: #EDE8DC; --map-b: #E6E8DD; --map-c: #F1ECE0; --map-d: #E8E3D5;
      --map-line: #D7CFBD; --map-water: #DCE6E7; --map-road: #F2EEE4;
      --shadow: 0 20px 40px -22px rgba(25,30,35,.38), 0 2px 8px rgba(25,30,35,.07);
      --display: 'Spectral', Georgia, 'Times New Roman', serif;
      --ui: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
    }
    .root[data-theme="dark"] {
      --bg: #14181B; --card: #1B2126; --field: #171D21;
      --ink: #EDF0F2; --ink-soft: #96A0A8;
      --rule: #262E34; --rule-strong: #3A444B;
      --map-a: #181D21; --map-b: #1A211F; --map-c: #151A1D; --map-d: #1C2227;
      --map-line: #232B30; --map-water: #162326; --map-road: #202830;
      --shadow: 0 20px 40px -22px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
    }
    .veil { background: linear-gradient(180deg, rgba(247,244,238,0) 0%, rgba(247,244,238,.5) 34%, #F7F4EE 62%); }
    .root[data-theme="dark"] .veil { background: linear-gradient(180deg, rgba(20,24,27,0) 0%, rgba(20,24,27,.5) 34%, #14181B 62%); }
    .root a { color: var(--ink); }
    .root a:hover { color: var(--ink-soft); }
    .root input::placeholder { color: var(--ink-soft); opacity: .78; }
  </style>
</helmet>

<div class="root" data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px;">

  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;">
    <rect x="0" y="0" width="1600" height="1000" fill="var(--map-c)"></rect>
    <g stroke="var(--map-line)" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="0,0 320,-10 350,215 0,240" fill="var(--map-a)"></polygon>
      <polygon points="320,-10 640,10 610,270 350,215" fill="var(--map-b)"></polygon>
      <polygon points="640,10 960,-5 985,235 610,270" fill="var(--map-c)"></polygon>
      <polygon points="960,-5 1280,5 1250,265 985,235" fill="var(--map-d)"></polygon>
      <polygon points="1280,5 1600,0 1600,245 1250,265" fill="var(--map-a)"></polygon>
      <polygon points="0,240 350,215 300,485 0,510" fill="var(--map-d)"></polygon>
      <polygon points="350,215 610,270 665,530 300,485" fill="var(--map-c)"></polygon>
      <polygon points="610,270 985,235 930,495 665,530" fill="var(--map-a)"></polygon>
      <polygon points="985,235 1250,265 1310,520 930,495" fill="var(--map-b)"></polygon>
      <polygon points="1250,265 1600,245 1600,490 1310,520" fill="var(--map-c)"></polygon>
      <polygon points="0,510 300,485 365,770 0,745" fill="var(--map-b)"></polygon>
      <polygon points="300,485 665,530 620,725 365,770" fill="var(--map-d)"></polygon>
      <polygon points="665,530 930,495 1000,765 620,725" fill="var(--map-c)"></polygon>
      <polygon points="930,495 1310,520 1270,735 1000,765" fill="var(--map-a)"></polygon>
      <polygon points="1310,520 1600,490 1600,760 1270,735" fill="var(--map-d)"></polygon>
      <polygon points="0,745 365,770 320,1000 0,1000" fill="var(--map-c)"></polygon>
      <polygon points="365,770 620,725 640,1000 320,1000" fill="var(--map-a)"></polygon>
      <polygon points="620,725 1000,765 960,1000 640,1000" fill="var(--map-b)"></polygon>
      <polygon points="1000,765 1270,735 1280,1000 960,1000" fill="var(--map-d)"></polygon>
      <polygon points="1270,735 1600,760 1600,1000 1280,1000" fill="var(--map-c)"></polygon>
    </g>
    <path d="M-20,300 C260,340 380,470 620,500 C840,528 980,470 1180,520 C1360,564 1480,640 1620,660 L1620,724 C1460,704 1340,632 1170,588 C980,540 850,598 615,566 C360,534 240,404 -20,364 Z" fill="var(--map-water)"></path>
    <g stroke="var(--map-road)" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M-20,640 L420,600 L760,700 L1180,650 L1620,690"></path>
      <path d="M520,-20 L560,300 L500,640 L560,1020"></path>
      <path d="M1080,-20 L1040,260 L1120,540 L1080,1020"></path>
    </g>
    <polygon points="610,270 985,235 930,495 665,530" fill="{{accentTint}}" stroke="{{accent}}" stroke-width="4" stroke-linejoin="round"></polygon>
    <circle cx="797" cy="382" r="44" fill="{{accentTint}}"></circle>
    <circle cx="797" cy="382" r="15" fill="{{accent}}" stroke="var(--card)" stroke-width="5"></circle>
  </svg>

  <div class="veil" style="position: absolute; inset: 0;"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 20px;">

    <div style="background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 28px 24px 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <h1 style="margin: 0; font-family: var(--display); font-weight: 600; font-size: 36px; line-height: 1.04; letter-spacing: -0.028em; color: var(--ink);">YourElectionMap</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-soft); text-wrap: pretty;">Enter your address to see your districts, candidates, and upcoming election dates.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px;">
        <label for="addr-am" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Home address</label>

        <div style="position: relative; display: flex; align-items: center;">
          <span style="position: absolute; left: 14px; display: flex; color: var(--ink-soft); pointer-events: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </span>
          <input id="addr-am" type="text" placeholder="Enter your home address" style="width: 100%; height: 52px; padding: 0 14px 0 44px; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--rule-strong); border-radius: 4px; outline: none;">
        </div>

        <button type="submit" style="height: 52px; width: 100%; font-family: inherit; font-size: 16px; font-weight: 600; color: {{onAccent}}; background: {{accent}}; border: none; border-radius: 4px; cursor: pointer;">Find my elections</button>

        <button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600; color: {{accent}}; background: none; border: none; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
          Use my current location
        </button>

        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); text-align: center;">We use your address only to look up your voting districts.</p>
      </form>

    </div>

    <p style="margin: 18px 0 0; font-size: 11px; letter-spacing: .04em; color: var(--ink-soft); text-align: center;">Nonpartisan · Not affiliated with any election authority</p>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#0F6E6E","options":["#0F6E6E","#1D4E89","#7A5C2E","#5B3A70"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const accent = this.adjust(this.props.accent ?? '#0F6E6E', theme === 'dark' ? 'onDark' : 'onLight');
    return {
      theme: theme,
      accent: accent,
      onAccent: this.pickInk(accent),
      accentTint: this.tint(accent, theme === 'dark' ? 0.24 : 0.14)
    };
  }
  rgb(input) {
    let h = String(input).replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [15, 110, 110];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  toHex(r, g, b) {
    const p = function (v) { return ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2); };
    return '#' + p(r) + p(g) + p(b);
  }
  adjust(input, mode) {
    const c = this.rgb(input);
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    const l = (mx + mn) / 2;
    let s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    let h = 0;
    if (d !== 0) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    let L = l, S = s;
    if (mode === 'onDark') { L = Math.max(l, 0.58); S = Math.min(s, 0.45); }
    else { L = Math.min(l, 0.44); S = Math.max(s, 0.3); }
    const cc = (1 - Math.abs(2 * L - 1)) * S;
    const x = cc * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = L - cc / 2;
    let t = [cc, x, 0];
    if (h >= 60 && h < 120) t = [x, cc, 0];
    else if (h >= 120 && h < 180) t = [0, cc, x];
    else if (h >= 180 && h < 240) t = [0, x, cc];
    else if (h >= 240 && h < 300) t = [x, 0, cc];
    else if (h >= 300) t = [cc, 0, x];
    return this.toHex((t[0] + m) * 255, (t[1] + m) * 255, (t[2] + m) * 255);
  }
  lum(input) {
    const c = this.rgb(input).map(function (v) {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  ratio(a, b) {
    const x = this.lum(a), y = this.lum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }
  pickInk(input) {
    return this.ratio(input, '#FFFFFF') >= this.ratio(input, '#141210') ? '#FFFFFF' : '#141210';
  }
  tint(input, a) {
    const c = this.rgb(input);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
}
</script>
</body>
</html>
