<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@1,6..72,200..600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root {
      --bg: #141210; --fg: #F6F1E9; --fg-soft: #A2988A; --rule: #38302A;
      --display: 'Archivo', 'Arial Black', Helvetica, sans-serif;
      --ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    }
    .root[data-theme="light"] {
      --bg: #F6F1E9; --fg: #141210; --fg-soft: #6B6155; --rule: #D5CBBB;
    }
    .root a { color: var(--fg); }
    .root a:hover { color: var(--fg-soft); }
    .root input::placeholder { color: var(--fg-soft); opacity: .85; }
  </style>
</helmet>

<div class="root" data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 16px; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 24px;">

    <h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 102%; font-size: 58px; line-height: 0.88; letter-spacing: -0.042em; text-transform: uppercase; color: var(--fg);">
      <span style="display: block;">Your</span>
      <span style="display: block;">Election</span>
      <span style="display: inline-block; margin-top: 4px; padding: 0 10px 6px; background: {{accent}}; color: {{onAccent}};">Map</span>
    </h1>

    <p style="margin: 24px 0 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 19px; line-height: 1.36; color: var(--fg); text-wrap: pretty;">Enter your address to see your districts, candidates, and upcoming election dates.</p>

    <form style="margin: 34px 0 0; display: flex; flex-direction: column; gap: 18px;">
      <label for="addr-bm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Home address</label>

      <input id="addr-bm" type="text" placeholder="Enter your home address" style="width: 100%; height: 56px; padding: 0 2px; font-family: inherit; font-size: 19px; font-weight: 500; color: var(--fg); background: transparent; border: none; border-bottom: 2px solid var(--rule); border-radius: 0; outline: none;">

      <button type="submit" style="width: 100%; height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 16px; font-weight: 700; color: {{onAccent}}; background: {{accent}}; border: none; border-radius: 999px; cursor: pointer;">
        Find my elections
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg>
      </button>

      <button type="button" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 700; color: {{accent}}; background: none; border: none; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
        Use my current location
      </button>

      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg-soft);">We use your address only to look up your voting districts.</p>
    </form>

  </div>

  <div style="flex-shrink: 0; padding: 16px 24px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center;">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-align: center; line-height: 1.5;">Nonpartisan · Not affiliated with any election authority</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#E4572E","#2FB39A","#B8C630"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const accent = this.adjust(this.props.accent ?? '#F2A93B', theme === 'dark' ? 'onDark' : 'onLight');
    return {
      theme: theme,
      accent: accent,
      onAccent: this.pickInk(accent)
    };
  }
  rgb(input) {
    let h = String(input).replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [242, 169, 59];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  toHex(r, g, b) {
    const p = function (v) { return ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2); };
    return '#' + p(r) + p(g) + p(b);
  }
  adjust(input, mode) {
    const c = this.rgb(input);
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    const l = (mx + mn) / 2;
    let s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    let h = 0;
    if (d !== 0) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    let L = l, S = s;
    if (mode === 'onDark') { L = Math.max(l, 0.58); S = Math.min(s, 0.85); }
    else { L = Math.min(l, 0.46); S = Math.max(s, 0.4); }
    const cc = (1 - Math.abs(2 * L - 1)) * S;
    const x = cc * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = L - cc / 2;
    let t = [cc, x, 0];
    if (h >= 60 && h < 120) t = [x, cc, 0];
    else if (h >= 120 && h < 180) t = [0, cc, x];
    else if (h >= 180 && h < 240) t = [0, x, cc];
    else if (h >= 240 && h < 300) t = [x, 0, cc];
    else if (h >= 300) t = [cc, 0, x];
    return this.toHex((t[0] + m) * 255, (t[1] + m) * 255, (t[2] + m) * 255);
  }
  lum(input) {
    const c = this.rgb(input).map(function (v) {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  ratio(a, b) {
    const x = this.lum(a), y = this.lum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }
  pickInk(input) {
    return this.ratio(input, '#F6F1E9') >= this.ratio(input, '#141210') ? '#F6F1E9' : '#141210';
  }
}
</script>
</body>
</html>
