<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .atlas {
      --bg: #FAF5EB; --card: #FFFDF8; --field: #FBF7EF;
      --ink: #241C12; --ink-soft: #6E6252;
      --rule: #E7DCC8; --rule-strong: #CFC0A4;
      --grid: #EEE5D2; --grid-strong: #E2D6BC;
      --district: #C9BA9C; --water: #E4EAE1;
      --shadow: 0 26px 52px -26px rgba(60,44,22,.34), 0 2px 6px rgba(60,44,22,.06);
      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    .atlas[data-theme="dark"] {
      --bg: #191410; --card: #221C16; --field: #1D1813;
      --ink: #F2EBE0; --ink-soft: #A0927F;
      --rule: #33291F; --rule-strong: #4A3C2D;
      --grid: #201A13; --grid-strong: #2B2318;
      --district: #4A3D2C; --water: #1A2018;
      --shadow: 0 26px 52px -26px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
    }
    .atlas .veil { background: linear-gradient(94deg, rgba(250,245,235,.9) 0%, rgba(250,245,235,.74) 32%, rgba(250,245,235,.3) 55%, rgba(250,245,235,0) 76%); }
    .atlas[data-theme="dark"] .veil { background: linear-gradient(94deg, rgba(25,20,16,.9) 0%, rgba(25,20,16,.74) 32%, rgba(25,20,16,.3) 55%, rgba(25,20,16,0) 76%); }
    .atlas input::placeholder { color: var(--ink-soft); opacity: .8; }
  </style>
</helmet>

<div class="atlas" data-theme="{{theme}}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px;">

  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;">
    <rect x="0" y="0" width="1600" height="1000" fill="var(--bg)"></rect>

    <g stroke="var(--grid)" stroke-width="1">
      <path d="M50,0 V1000 M100,0 V1000 M150,0 V1000 M200,0 V1000 M250,0 V1000 M300,0 V1000 M350,0 V1000 M400,0 V1000 M450,0 V1000 M500,0 V1000 M550,0 V1000 M600,0 V1000 M650,0 V1000 M700,0 V1000 M750,0 V1000 M800,0 V1000 M850,0 V1000 M900,0 V1000 M950,0 V1000 M1000,0 V1000 M1050,0 V1000 M1100,0 V1000 M1150,0 V1000 M1200,0 V1000 M1250,0 V1000 M1300,0 V1000 M1350,0 V1000 M1400,0 V1000 M1450,0 V1000 M1500,0 V1000 M1550,0 V1000"></path>
      <path d="M0,50 H1600 M0,100 H1600 M0,150 H1600 M0,200 H1600 M0,250 H1600 M0,300 H1600 M0,350 H1600 M0,400 H1600 M0,450 H1600 M0,500 H1600 M0,550 H1600 M0,600 H1600 M0,650 H1600 M0,700 H1600 M0,750 H1600 M0,800 H1600 M0,850 H1600 M0,900 H1600 M0,950 H1600"></path>
    </g>
    <g stroke="var(--grid-strong)" stroke-width="1.2">
      <path d="M200,0 V1000 M400,0 V1000 M600,0 V1000 M800,0 V1000 M1000,0 V1000 M1200,0 V1000 M1400,0 V1000"></path>
      <path d="M0,200 H1600 M0,400 H1600 M0,600 H1600 M0,800 H1600"></path>
    </g>

    <path d="M-20,300 C260,340 380,470 620,500 C840,528 980,470 1180,520 C1360,564 1480,640 1620,660 L1620,724 C1460,704 1340,632 1170,588 C980,540 850,598 615,566 C360,534 240,404 -20,364 Z" fill="var(--water)"></path>

    <g fill="none" stroke="var(--district)" stroke-width="1.8" stroke-linejoin="round">
      <polygon points="0,0 320,-10 350,215 0,240"></polygon>
      <polygon points="320,-10 640,10 610,270 350,215"></polygon>
      <polygon points="640,10 960,-5 985,235 610,270"></polygon>
      <polygon points="960,-5 1280,5 1250,265 985,235"></polygon>
      <polygon points="1280,5 1600,0 1600,245 1250,265"></polygon>
      <polygon points="0,240 350,215 300,485 0,510"></polygon>
      <polygon points="350,215 610,270 665,530 300,485"></polygon>
      <polygon points="610,270 985,235 930,495 665,530"></polygon>
      <polygon points="985,235 1250,265 1310,520 930,495"></polygon>
      <polygon points="1250,265 1600,245 1600,490 1310,520"></polygon>
      <polygon points="0,510 300,485 365,770 0,745"></polygon>
      <polygon points="300,485 665,530 620,725 365,770"></polygon>
      <polygon points="665,530 930,495 1000,765 620,725"></polygon>
      <polygon points="930,495 1310,520 1270,735 1000,765"></polygon>
      <polygon points="1310,520 1600,490 1600,760 1270,735"></polygon>
      <polygon points="0,745 365,770 320,1000 0,1000"></polygon>
      <polygon points="365,770 620,725 640,1000 320,1000"></polygon>
      <polygon points="620,725 1000,765 960,1000 640,1000"></polygon>
      <polygon points="1000,765 1270,735 1280,1000 960,1000"></polygon>
      <polygon points="1270,735 1600,760 1600,1000 1280,1000"></polygon>
    </g>

    <polygon points="930,495 1310,520 1270,735 1000,765" fill="{{accentTint}}" stroke="{{accent}}" stroke-width="3" stroke-linejoin="round"></polygon>
    <g stroke="{{accent}}" stroke-width="1" opacity=".5">
      <path d="M950,730 L1290,505 M985,762 L1305,540 M938,660 L1240,462 M1000,780 L1312,585"></path>
    </g>
    <g stroke="{{accent}}" stroke-width="1.3">
      <path d="M1127,571 V687 M1069,629 H1185"></path>
    </g>
    <circle cx="1127" cy="629" r="8.5" fill="{{accent}}"></circle>
    <circle cx="1127" cy="629" r="25" fill="none" stroke="{{accent}}" stroke-width="1.3" stroke-dasharray="3 6"></circle>

    <g font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="1.2" fill="var(--ink-soft)" opacity=".55">
      <text x="806" y="24">800</text>
      <text x="1006" y="24">1000</text>
      <text x="1206" y="24">1200</text>
      <text x="1406" y="24">1400</text>
      <text x="1548" y="206">200</text>
      <text x="1548" y="406">400</text>
      <text x="1548" y="606">600</text>
      <text x="1548" y="806">800</text>
    </g>
  </svg>

  <div class="veil" style="position: absolute; inset: 0;"></div>

  <div style="position: relative; height: 100%; display: flex; align-items: center; padding: 0 84px;">
    <div style="width: 560px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 40px 42px 34px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; flex-direction: column; gap: 13px;">
        <div style="display: flex; align-items: center; gap: 8px; color: {{accent}};">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4Z"></path><path d="M9 4v14M15 6.5v14"></path></svg>
          <span style="font-size: 11px; font-weight: 600; letter-spacing: .17em; text-transform: uppercase;">Local election maps</span>
        </div>
        <h1 style="margin: 0; font-family: var(--display); font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.022em; color: var(--ink);">YourElectionMap</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink-soft); max-width: 42ch; text-wrap: pretty;">See the district maps you vote in — plus the candidates and dates that come with them.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px;">
        <label for="atlas-addr" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Home address</label>

        <div style="display: flex; gap: 9px;">
          <div style="position: relative; flex-grow: 1; min-width: 0; display: flex; align-items: center;">
            <span style="position: absolute; left: 15px; display: flex; color: var(--ink-soft); pointer-events: none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </span>
            <input id="atlas-addr" type="text" placeholder="Enter your home address" style="width: 100%; height: 50px; padding: 0 14px 0 42px; font-family: inherit; font-size: 15.5px; color: var(--ink); background: var(--field); border: 1px solid var(--rule-strong); border-radius: 8px; outline: none;">
          </div>
          <button type="submit" style="height: 50px; padding: 0 22px; font-family: inherit; font-size: 15px; font-weight: 600; color: {{onAccent}}; background: {{accent}}; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;">Find My Maps</button>
        </div>

        <div style="display: flex; align-items: center; gap: 13px;">
          <button type="button" style="display: flex; align-items: center; gap: 6px; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: {{accent}}; background: none; border: none; cursor: pointer;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
            Use my current location
          </button>
          <span style="width: 1px; height: 14px; background: var(--rule-strong);"></span>
          <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft);">Address used only to look up your districts.</p>
        </div>
      </form>

      <div style="border-top: 1px solid var(--rule); padding-top: 15px; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;">
        <span style="font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft);">Also included</span>
        <span style="font-size: 13.5px; color: var(--ink-soft);">candidates · ballot measures · election dates</span>
      </div>

    </div>
  </div>

  <p style="position: absolute; left: 84px; bottom: 34px; margin: 0; font-size: 12px; letter-spacing: .05em; color: var(--ink-soft);">Nonpartisan · Not affiliated with any election authority</p>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#B4552B","options":["#B4552B","#8C6A1F","#7A4230","#4E6B36"],"section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const accent = this.adjust(this.props.accent ?? '#B4552B', theme === 'dark' ? 'onDark' : 'onLight');
    return {
      theme: theme,
      accent: accent,
      onAccent: this.pickInk(accent),
      accentTint: this.tint(accent, theme === 'dark' ? 0.2 : 0.11)
    };
  }
  rgb(input) {
    let h = String(input).replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [180, 85, 43];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  toHex(r, g, b) {
    const p = function (v) { return ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2); };
    return '#' + p(r) + p(g) + p(b);
  }
  hsl(input) {
    const c = this.rgb(input);
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    const l = (mx + mn) / 2;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    let h = 0;
    if (d !== 0) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return [h, s, l];
  }
  fromHsl(h, S, L) {
    const cc = (1 - Math.abs(2 * L - 1)) * S;
    const x = cc * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = L - cc / 2;
    let t = [cc, x, 0];
    if (h >= 60 && h < 120) t = [x, cc, 0];
    else if (h >= 120 && h < 180) t = [0, cc, x];
    else if (h >= 180 && h < 240) t = [0, x, cc];
    else if (h >= 240 && h < 300) t = [x, 0, cc];
    else if (h >= 300) t = [cc, 0, x];
    return this.toHex((t[0] + m) * 255, (t[1] + m) * 255, (t[2] + m) * 255);
  }
  adjust(input, mode) {
    const p = this.hsl(input);
    let L = p[2], S = p[1];
    if (mode === 'onDark') { L = Math.max(p[2], 0.62); S = Math.min(p[1], 0.52); }
    else { L = Math.min(p[2], 0.43); S = Math.max(p[1], 0.32); }
    return this.fromHsl(p[0], S, L);
  }
  lum(input) {
    const c = this.rgb(input).map(function (v) {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  ratio(a, b) {
    const x = this.lum(a), y = this.lum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }
  pickInk(input) {
    return this.ratio(input, '#FFFDF8') >= this.ratio(input, '#241C12') ? '#FFFDF8' : '#241C12';
  }
  tint(input, a) {
    const c = this.rgb(input);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
}
</script>
</body>
</html>
